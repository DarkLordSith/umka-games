<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no: в установленной PWA iOS их соблюдает, зума нет -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent: страница уходит под статус-бар. Там только полоса фона .sky
     (src/app/base.css), белые часы на ней читаются. Кнопок в верхних ~80 pt нет:
     в PWA iOS эта зона размыта (урок «Тёмного прилавка»). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Умка">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<title>Умка</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
